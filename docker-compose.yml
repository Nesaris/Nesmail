# RAVYN seul, sans le Hub. Le .env porte les réglages (voir .env.example).
# Le port n'est ouvert que sur l'adresse de RAVYN_BIND (127.0.0.1 par défaut :
# derrière un relais HTTPS sur la même machine).
services:
  ravyn:
    build: .
    image: ravyn:2.0.0
    container_name: ravyn
    restart: unless-stopped
    ports:
      - "${RAVYN_BIND:-127.0.0.1}:${RAVYN_PORT:-8787}:8787"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    # La clé maîtresse vient d'un secret Docker, jamais du volume qu'elle protège.
    secrets: [socle_cle]
    environment:
      SOCLE_CLE_FILE: /run/secrets/socle_cle
      SOCLE_HTTP: ${SOCLE_HTTP:-0}
      SOCLE_PROXYS: ${SOCLE_PROXYS:-}
      SOCLE_URL_PUBLIQUE: ${SOCLE_URL_PUBLIQUE:-}
      SOCLE_THEME: ${SOCLE_THEME:-soma}
      RAVYN_SECRET_V1: ${RAVYN_SECRET_V1:-}
    volumes:
      - ravyn-data:/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

secrets:
  socle_cle:
    file: ./secrets/socle_cle

volumes:
  ravyn-data:
